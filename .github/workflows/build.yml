name: Build Plugins

concurrency: 
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - feature/cloudstream-plugin
    paths-ignore:
      - '*.md'
      - 'monitor.py'
      - 'sources.json'
      - 'tests/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout builds branch
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"

      - name: Clean old builds
        run: rm $GITHUB_WORKSPACE/builds/*.cs3 || true

      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Install Android SDK command-line tools
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          curl -L https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest

      - name: Install Android SDK components
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          echo "y" | sdkmanager --licenses || true
          sdkmanager "platform-tools" "build-tools;30.0.3" "platforms;android-30"

      - name: Build Plugins
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          
          echo "=== Available Gradle tasks ==="
          ./gradlew tasks --all 2>&1 | grep -E "(make|build)" || true
          
          echo "=== Building ExampleProvider ==="
          ./gradlew ExampleProvider:make 2>&1 | tee /tmp/gradle-build.log
          
          echo "=== Looking for .cs3 files ==="
          find . -name "*.cs3" -type f 2>/dev/null || true
          
          # Copy any built artifacts to builds directory
          if ls **/build/*.cs3 1> /dev/null 2>&1; then
            cp **/build/*.cs3 $GITHUB_WORKSPACE/builds
            echo "Copied .cs3 files"
          else
            echo "No .cs3 files found after build"
            # Show last 50 lines of gradle output for debugging
            tail -50 /tmp/gradle-build.log
          fi
          
          # Generate plugins.json from built artifacts
          if [ -f build/plugins.json ]; then
            cp build/plugins.json $GITHUB_WORKSPACE/builds
          else
            echo "Creating empty plugins.json"
            echo '[]' > $GITHUB_WORKSPACE/builds/plugins.json
          fi

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Build artifacts from $GITHUB_SHA"
            git push origin builds
          else
            echo "No changes to commit"
          fi
