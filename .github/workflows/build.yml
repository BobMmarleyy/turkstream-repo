name: Build Plugins

concurrency: 
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - feature/cloudstream-plugin
    paths-ignore:
      - '*.md'
      - 'monitor.py'
      - 'sources.json'
      - 'tests/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
    
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout builds branch
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"

      - name: Clean old builds
        run: rm $GITHUB_WORKSPACE/builds/*.cs3 || true

      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Install Android SDK command-line tools
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          curl -L https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest

      - name: Install Android SDK components
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          echo "y" | sdkmanager --licenses || true
          sdkmanager "platform-tools" "build-tools;30.0.3" "platforms;android-30"

      - name: Build Plugins
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          
          # Create local.properties with SDK location
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          echo "=== Building ExampleProvider ==="
          ./gradlew ExampleProvider:make 2>&1 | tee /tmp/gradle-build.log
          
          echo "=== Looking for .cs3 files ==="
          find . -name "*.cs3" -type f 2>/dev/null || true
          
          # Check if make task actually ran successfully
          if grep -q "BUILD SUCCESSFUL" /tmp/gradle-build.log; then
            echo "Gradle build was successful"
            
            # Try to find .cs3 files in various locations
            CS3_FILES=$(find . -name "*.cs3" -type f 2>/dev/null)
            if [ -n "$CS3_FILES" ]; then
              echo "Found .cs3 files:"
              echo "$CS3_FILES"
              for file in $CS3_FILES; do
                cp "$file" $GITHUB_WORKSPACE/builds/
              done
              echo "Copied .cs3 files to builds directory"
            else
              echo "No .cs3 files found after successful build"
              # Check if there's a different output format
              find . -name "*.apk" -o -name "*.jar" 2>/dev/null | head -10 || true
            fi
            
            # Generate plugins.json from built artifacts
            if [ -f build/plugins.json ]; then
              cp build/plugins.json $GITHUB_WORKSPACE/builds/
              echo "Copied generated plugins.json"
            else
              echo "No plugins.json generated by Gradle, creating empty one"
              echo '[]' > $GITHUB_WORKSPACE/builds/plugins.json
            fi
          else
            echo "Gradle build failed"
            tail -50 /tmp/gradle-build.log
            exit 1
          fi

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Build artifacts from $GITHUB_SHA"
            git push origin builds
          else
            echo "No changes to commit"
          fi
